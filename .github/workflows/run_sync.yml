name: Daily Sync

on:
  schedule:
    # FULL sync (events + odds) once daily at 09:00 Romania, before ticket generation at 10:00
    - cron: '0 7 * 1-3,11-12 *'   # Winter: 09:00 Romania (EET, UTC+2)
    - cron: '0 6 * 4-10 *'        # Summer: 09:00 Romania (EEST, UTC+3)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Write Firebase service account
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty or not set"
            exit 1
          fi
          python - <<'PY'
          import base64
          import json
          import os

          value = os.environ["FIREBASE_SA"].strip()
          try:
              decoded = base64.b64decode(value, validate=True).decode("utf-8")
              json.loads(decoded)
          except (ValueError, UnicodeDecodeError, json.JSONDecodeError):
              decoded = value
              json.loads(decoded)
          with open("firebase-service-account.json", "w", encoding="utf-8") as file:
              file.write(decoded)
          print("Firebase SA JSON is valid")
          PY
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Run sync script
        env:
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: firebase-service-account.json
        run: python auto_sync_master.py